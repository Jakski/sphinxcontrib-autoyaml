[build-system]
requires = ["setuptools >= 66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinxcontrib-autoyaml"
version = "1.2.0"
description = "Sphinx autodoc extension for documenting YAML files from comments"
authors = [
  {name = "Jakub Pieńkowski", email = "jakub+sphinxcontrib-autoyaml@jakski.name"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Sphinx :: Extension",
  "Intended Audience :: System Administrators",
  "Topic :: Documentation",
]
requires-python = ">=3.6"
dependencies = [
  "Sphinx>=3.5.1",
  "ruamel.yaml>=0.16.12",
]

[tool.setuptools]
packages = ["sphinxcontrib.autoyaml"]

[dependency-groups]
dev = [
  "pylsp-mypy>=0.5.8",
  "python-lsp-server>=1.3.3",
  "ruff>=0.0.17",
  "types-docutils>=0.20.0.3",
]
