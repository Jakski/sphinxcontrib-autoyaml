name: Tests

on:
  push:
    branches:
      - master
      - test
    paths-ignore:
      - README.md
      - LICENSE
      - CHANGELOG
      - .gitignore

jobs:
  linux:
    name: Linux, Python ${{ matrix.python }}, environment ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["py3-10", "py3-11", "py3-14"]
        env: ["1", "2", "3", "4", "5"]
        exclude:
          # Deprecated imghdr
          - python: "py3-14"
            env: "1"
          # Deprecated imghdr
          - python: "py3-14"
            env: "2"
          # Deprecated imghdr
          - python: "py3-14"
            env: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: jdx/mise-action@v3
        with:
          version: 2026.5.15 # [default: latest] mise version to install
          cache: true # [default: true] cache mise using GitHub's cache

      - name: Run tests
        run: mise run test
        env:
          MISE_ENV: ${{ matrix.python }}
          ENV_NUMBER: ${{ matrix.env }}
